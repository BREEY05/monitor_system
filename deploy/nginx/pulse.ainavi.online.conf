# PULSE · nginx 站点（公网入口）
# 架构：手机 App / 浏览器 → HTTPS → 本机 nginx → 127.0.0.1:18000（frp 隧道）→ 你的 Windows 电脑 127.0.0.1:8000
#
# 安装：
#   sudo cp deploy/nginx/pulse.ainavi.online.conf /etc/nginx/sites-available/pulse.ainavi.online
#   sudo ln -sf /etc/nginx/sites-available/pulse.ainavi.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pulse.ainavi.online --redirect
#
# 注意：
#   - 不要动已有的 /etc/nginx/sites-enabled/ainavi.online（主站）
#   - 这里先只有 80 端口，certbot --nginx 会自动复制出 443 server 块并加跳转
#   - 隧道没连上 / 本机后端没起来时，返回「本地引擎离线」页

map $http_upgrade $pulse_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # 如果服务器没有 IPv6，不要加 listen [::]:80;（会报 Address family not supported）
    server_name pulse.ainavi.online;

    access_log /var/log/nginx/pulse.access.log;
    error_log  /var/log/nginx/pulse.error.log;

    # certbot 续期验证（放在最前，避免被反代吃掉）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # 3D 模型上传上限（后端限制 80MB，这里留余量）
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（/ws/sensor、/ws/chat）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $pulse_conn_upgrade;

        # AI 对话可能 10s+，模型上传更久
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # 隧道断开或本机后端没起来 → 友好兜底页（HTTP 503）
    error_page 502 504 = @pulse_offline;
    location @pulse_offline {
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE · 本地引擎离线</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#F4F5F7;color:#101828;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.box{max-width:420px;padding:32px 26px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(16,24,40,.08)}h1{margin:0 0 10px;font-size:20px}p{margin:8px 0;color:#667085;font-size:13px;line-height:1.7}ul{margin:12px 0 0;padding-left:18px;color:#475467;font-size:13px;line-height:1.9}code{background:#F2F4F7;border-radius:6px;padding:1px 5px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#F79009;margin-right:8px;vertical-align:1px}</style></head><body><div class="box"><h1>本地引擎离线</h1><p><span class="dot"></span>公网入口正常，但本机后端或隧道未连接。</p><ul><li>确认跑 PULSE 的电脑已开机、没有休眠</li><li>确认 <code>frpc</code> 计划任务在运行</li><li>确认 <code>uvicorn</code> 已在 <code>127.0.0.1:8000</code> 启动</li></ul><p style="margin-top:18px">恢复后刷新本页即可。</p></div></body></html>';
    }
}
