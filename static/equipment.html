<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备情况 · 数字孪生</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#263445;background:#f5f7fb;font-size:13px;--line:#dce3ec;--brand:#1d4ed8;--muted:#718096}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}
.workspace{height:100%;display:grid;grid-template-columns:190px minmax(0,1fr) 228px;gap:10px;padding:0}
.panel{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:0;min-height:0}
.left{padding:16px 12px;overflow:auto}.heading{font-size:13px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}.count,.muted{color:var(--muted);font-size:11px;font-weight:400}
.search{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;outline:none;margin-bottom:14px}.search:focus{border-color:#7097e8}
.tree-group{color:#718096;font-size:11px;padding:5px 8px 9px}
.device-item{display:block;width:100%;text-align:left;padding:10px 9px;border:1px solid transparent;border-radius:4px;background:none;margin-bottom:5px}
.device-item:hover{background:#f5f8fc}.device-item.active{background:#eff6ff;border-color:#d6e5ff;color:#1d4ed8}
.device-name{display:flex;gap:7px;align-items:center;font-weight:600;font-size:12px;overflow-wrap:anywhere}.device-name:before{content:"";width:6px;height:6px;background:#94a3b8;border-radius:50%;flex:none}.device-item.active .device-name:before{background:#3974c9}
.device-meta{display:block;font-size:10px;color:#7c8999;margin:5px 0 0 13px;line-height:1.5}.alarm .device-name:before{background:#d24b50}
.legend{padding:14px 6px;border-top:1px solid #e8edf3;margin-top:14px;line-height:1.8;font-size:11px;color:#7a8797}
.center{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 80px;gap:10px}
.viewport{position:relative;overflow:hidden;background:#f0f4f8}
.scene-top{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid #e3e9ef}
.scene-top h1{font-size:15px;margin:0 0 4px;font-weight:650}.scene-top p{font-size:11px;color:#7a8797;margin:0}
.tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.tools button,.action{height:30px;padding:0 10px;border:1px solid #d8e1ed;border-radius:4px;background:#fff;font-size:11px;white-space:nowrap}
.tools button:hover,.action:hover{background:#f0f6ff;border-color:#a7c2ed}.tools button.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.canvas-wrap{position:absolute;inset:73px 0 0}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:73px 0 0;pointer-events:none;overflow:hidden}.model-label{position:absolute;transform:translate(-50%,-100%);padding:4px 8px;border:1px solid #dce3ec;border-radius:3px;background:#fffffff0;color:#4d6075;font-size:10px;white-space:nowrap}.model-label.active{border-color:#83aceb;color:#1d4ed8}.model-label.alarm{border-color:#d24b50;color:#ba3f44}
.scene-bottom{position:absolute;bottom:12px;left:14px;z-index:2;font-size:10px;color:#7b8998;background:#ffffffcf;padding:5px 8px;border-radius:3px;max-width:calc(100% - 115px)}
.axis{position:absolute;right:12px;bottom:12px;width:80px;height:80px;background:#ffffffdf;border:1px solid var(--line);border-radius:5px;padding:4px;z-index:2}.axis canvas{display:block;width:70px;height:57px}.axis small{display:block;text-align:center;color:#8593a4;font:9px Consolas,monospace}
.scene-error{position:absolute;inset:100px 24px;display:grid;place-content:center;color:#7a8797;text-align:center;line-height:2}
.overview{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:14px}.overview strong{display:block;font-size:13px;margin-bottom:5px}.overview p{margin:0;font-size:11px;color:#7a8797}.overview .state{color:#77869a;font-size:11px}
.right{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}.card{padding:16px 14px}.part-name{font-size:15px;font-weight:650;margin:0 0 16px;overflow-wrap:anywhere}.data-row{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;margin:11px 0;font-size:11px;color:#7b8795}.data-row b{font-weight:400;color:#405268;overflow-wrap:anywhere}
.model-state{color:#255d9b;background:#eff6ff;padding:8px 10px;border-radius:4px;font-size:11px;margin:14px 0;line-height:1.7}.model-state.fallback{color:#8a672e;background:#faf6eb}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.buttons button{padding:0 7px}.buttons .primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.empty{font-size:11px;color:#8290a1;line-height:1.9;padding:12px 0}.metrics{display:grid;gap:9px}.metric{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#758497}.metric b{font-weight:500;color:#63758a}.card h2{font-size:13px;margin:0 0 12px}.source-note{font-size:10px;color:#93a0af;line-height:1.8;margin:12px 0 0;border-top:1px solid #eef1f5;padding-top:10px}
button:focus-visible{outline:2px solid #6195ed;outline-offset:2px}
@media(max-width:1000px){.workspace{grid-template-columns:155px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;overflow:visible}.workspace{height:auto;min-height:100vh;grid-template-rows:550px auto}body{height:auto;overflow:auto}.center{grid-column:2;grid-row:1}.left{grid-row:1}.right .card:last-child{display:none}.scene-top{align-items:flex-start;flex-direction:column}.canvas-wrap,.labels{top:110px}}
@media(max-width:600px){.workspace{display:flex;flex-direction:column;gap:8px}.left{padding:10px}.left .heading,.left .search,.left .legend,.tree-group{display:none}#tree{display:flex;overflow-x:auto;gap:6px}.device-item{min-width:140px;margin:0}.center{height:560px;flex:none}.right{display:grid;grid-template-columns:1fr}.scene-top{padding:12px}.overview{padding:10px}.overview .state{display:none}}
</style>
<style>
.model-label{max-width:170px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.model-label{max-width:95px;white-space:normal;text-align:center;overflow-wrap:anywhere}}
</style>
<script type="importmap">{"imports":{"three":"/static/vendor/three/build/three.module.js","three/addons/":"/static/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<main class="workspace">
<aside class="panel left">
  <h2 class="heading">设备总览 <span class="count" id="assetCount">加载中</span></h2>
  <input class="search" id="search" placeholder="搜索设备" aria-label="搜索设备">
  <div class="tree-group">生产间 / 设备工位</div><div id="tree"></div>
  <div class="legend">模型来源：设备配置优先<br>灰色标记：暂无状态数据<br>红色闪烁：服务端设备告警</div>
</aside>
<section class="center">
  <div class="panel viewport" id="viewport">
    <div class="scene-top"><div><h1 id="viewTitle">工业生产间</h1><p id="viewSubtitle">正在装配设备模型</p></div>
      <div class="tools"><button class="active" id="plantBtn">车间总览</button><button id="frontBtn">正视</button><button id="labelsBtn" class="active">标签</button><button id="resetBtn" title="重置视角与缩放">复位</button></div>
    </div>
    <div class="canvas-wrap" id="canvasWrap"></div><div class="labels" id="labels"></div>
    <div class="axis" aria-label="世界坐标轴"><canvas id="axisCanvas" width="140" height="114"></canvas><small>Y UP / WORLD</small></div>
  </div>
  <div class="panel overview"><div><strong id="overviewTitle">设备装配</strong><p id="modelSummary">正在读取设备配置</p></div><span class="state" id="serviceState">等待服务数据</span></div>
</section>
<aside class="right">
  <section class="panel card"><h2 class="heading">设备信息 <span class="count" id="partIndex"></span></h2>
    <div class="part-name" id="partName">未选择设备</div>
    <div class="data-row"><span>设备编号</span><b id="partCode">未配置</b></div>
    <div class="data-row"><span>对应工位</span><b id="stationName">未配置</b></div>
    <div class="data-row"><span>模型文件</span><b id="modelFile">未配置</b></div>
    <div class="data-row"><span>告警状态</span><b id="partStatus">暂无状态数据</b></div>
    <div class="model-state" id="modelState">等待设备配置</div>
    <div class="buttons"><button class="action primary" id="openDevice">单机查看</button><button class="action" id="openSettings">设备设置</button></div>
  </section>
  <section class="panel card"><h2>工况监测</h2><div class="empty">暂无传感器数据</div>
    <p class="source-note">等待设备传感点绑定与真实服务数据</p>
  </section>
  <section class="panel card"><h2>模型装配</h2><div class="empty" id="assemblyInfo">设备模型将自动居中并落地对齐。</div></section>
</aside>
</main>
<script type="module" src="/static/equipment-scene.js?v=4"></script>
</body>
</html>
